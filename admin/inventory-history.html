<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Inventory History

</title>

<link
rel="stylesheet"
href="/css/admin.css">

</head>

<body>

<div id="navbar"></div>

<div class="dashboard-layout">

<div
id="sidebar"
class="sidebar">
</div>

<div class="main-content">

<h1>

Inventory History

</h1>

<br>

<div
id="cards"
class="cards-grid">
</div>

<div class="card">

<input
id="searchInput"
placeholder="Search Product">

<select
id="movementFilter">

<option value="all">
All Movements
</option>

<option value="increase">
Restock
</option>

<option value="decrease">
Reduction
</option>

<option value="adjustment">
Adjustment
</option>

</select>

<input
type="date"
id="startDate">

<input
type="date"
id="endDate">

<select
id="sortOrder">

<option value="desc">
Newest First
</option>

<option value="asc">
Oldest First
</option>

</select>

<button
id="todayBtn">

Today

</button>

<button
id="weekBtn">

Last 7 Days

</button>

<button
id="monthBtn">

Last 30 Days

</button>

<button
id="allBtn">

All

</button>

<button
id="exportBtn">

Export CSV

</button>

</div>

<br>

<div
id="historyTable">

Loading...

</div>

</div>

</div>

<div id="footer"></div>

<script src="/components/navbar-loader.js"></script>

<script src="/components/footer-loader.js"></script>

<script src="/components/sidebar-loader.js"></script>

<script
type="module"
src="/js/admin/inventory-history.js">
</script>

<script type="module">

import {
requireAdmin
}
from "/js/services/guard.js";

await requireAdmin();

</script>

</body>

</html>
