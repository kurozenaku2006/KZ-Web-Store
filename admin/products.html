<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Products Management
</title>

<link rel="stylesheet"
href="/css/admin.css">

</head>

<body>

<div id="navbar"></div>

<div class="dashboard-layout">

    <div id="sidebar"
    class="sidebar"></div>

    <div class="main-content">

        <h1>
            Products
        </h1>

        <br>

        <input
        id="name"
        placeholder="Product Name">

        <br><br>

        <input
        id="price"
        placeholder="Price">

        <br><br>

        <input
        id="stock"
        placeholder="Stock">

        <br><br>

<input
id="category"
placeholder="Category">

<br><br>

<input
id="brand"
placeholder="Brand">

        <br><br>

        <button id="addBtn">

            Add Product

        </button>

        <br><br>

<h3>

Flash Sale

</h3>

<br>

<input
id="flashDiscount"
type="number"
placeholder="Discount %">

<br><br>

<input
id="flashStart"
type="datetime-local">

<br><br>

<input
id="flashEnd"
type="datetime-local">

<br><br>

<label>

<input
type="checkbox"
id="flashEnabled">

Enable Flash Sale

</label>

<br><br>

        <hr>

        <div id="productsList">

        </div>

    </div>

</div>

<div
id="inventoryModal"
style="
display:none;
position:fixed;
top:10%;
left:50%;
transform:translateX(-50%);
background:#1e2230;
padding:20px;
width:500px;
max-height:500px;
overflow:auto;
border-radius:12px;
z-index:999;
">

<h2>

Inventory History

</h2>

<br>

<div
id="inventoryContent">

</div>

<br>

<button
onclick="closeInventoryModal()">

Close

</button>

</div>

<div id="footer"></div>

<script src="/components/navbar-loader.js"></script>
<script src="/components/footer-loader.js"></script>
<script src="/components/sidebar-loader.js"></script>

<script type="module"
src="/js/admin/products.js">
</script>

<script type="module">

import {
requireAdmin
}
from "/js/services/guard.js";

await requireAdmin();

</script>

</body>

</html>
