<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Activity

</title>

<link
rel="stylesheet"
href="/css/admin.css">

</head>

<body>

<div id="navbar"></div>

<div class="dashboard-layout">

<div
id="sidebar"
class="sidebar"></div>

<div class="main-content">

<h1>

Activity Logs

</h1>

<br>

<div
id="activityStats"
class="cards-grid">

Loading Statistics...

</div>

<br>

<input
id="searchInput"
placeholder="Search">

<select
id="moduleFilter">

<option value="all">
All Modules
</option>

<option value="products">
Products
</option>

<option value="inventory">
Inventory
</option>

<option value="orders">
Orders
</option>

<option value="claims">
Claims
</option>

<option value="customers">
Customers
</option>

</select>

<button
id="refreshActivity">

Refresh

</button>

<button
onclick="exportActivity()">

Export CSV

</button>

<select
id="actionFilter">

<option value="all">

All Actions

</option>

</select>

<input
type="date"
id="dateFilter">

<br><br>

<hr>

<br>

<div
id="activityList">

Loading...

</div>

<br>

<div
id="activityPagination">

</div>

</div>

</div>

<div id="footer"></div>

<script src="/components/navbar-loader.js"></script>

<script src="/components/footer-loader.js"></script>

<script src="/components/sidebar-loader.js"></script>

<script
type="module"
src="/js/admin/activity.js">
</script>

<script type="module">

import {
requireAdmin
}
from "/js/services/guard.js";

await requireAdmin();

</script>

</body>

</html>
