<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Notifications

</title>

<link
rel="stylesheet"
href="/css/admin.css">

</head>

<body>

<div id="navbar"></div>

<div class="dashboard-layout">

<div
id="sidebar"
class="sidebar"></div>

<div class="main-content">

<h1>

Notifications

</h1>

<br>

<input
id="notificationSearch"
placeholder="Search Notifications">

<br><br>

<input
id="title"
placeholder="Title">

<br><br>

<textarea
id="message"
placeholder="Message">
</textarea>

<br><br>

<select
id="target">

<option value="all">
All Users
</option>

<option value="customers">
Customers
</option>

<option value="admins">
Admins
</option>

<option value="scheduled">
Scheduled
</option>

<option value="archived">
Archived
</option>

</select>

<br><br>

<input
type="datetime-local"
id="scheduleAt">

<br><br>

<input
id="customerUid"
placeholder="Customer UID (optional)">

<br><br>

<select
id="notificationChannel">

<option value="inapp">

In-App Only

</option>

<option value="email">

Email Ready

</option>

<option value="sms">

SMS Ready

</option>

<option value="push">

Push Ready

</option>

<option value="all">

All Channels

</option>

</select>

<br><br>

<select
id="notificationPriority">

<option value="normal">

Normal

</option>

<option value="important">

Important

</option>

<option value="critical">

Critical

</option>

</select>

<br><br>

<button
id="sendBtn">

Publish

</button>

<hr>

<div
id="notificationList">

</div>

</div>

</div>

<div id="footer"></div>

<script src="/components/navbar-loader.js"></script>

<script src="/components/footer-loader.js"></script>

<script src="/components/sidebar-loader.js"></script>

<script
type="module"
src="/js/admin/notifications.js">
</script>

<script type="module">

import {
requireAdmin
}
from "/js/services/guard.js";

await requireAdmin();

</script>

</body>

</html>
