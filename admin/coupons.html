<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Coupons

</title>

<link
rel="stylesheet"
href="/css/admin.css">

</head>

<body>

<div id="navbar"></div>

<div class="dashboard-layout">

<div
id="sidebar"
class="sidebar"></div>

<div class="main-content">

<h1>

Coupons

</h1>

<br>

<div
id="couponStats"
class="cards-grid">

Loading Statistics...

</div>

<br>

<input
id="code"
placeholder="Coupon Code">

<br><br>

<input
id="discount"
type="number"
placeholder="Discount %">

<br><br>

<input
id="limit"
type="number"
placeholder="Usage Limit">

<br><br>

<input
id="expiry"
type="date">

<br><br>

<input
id="maxPerCustomer"
type="number"
placeholder="Max Uses Per Customer">

<br><br>

<input
id="allowedCustomer"
placeholder="Restricted Customer UID (optional)">

<input
id="allowedEmail"
placeholder="Restricted Customer Email (optional)">

<br><br>

<label>

<input
type="checkbox"
id="oneTimeUse">

One Time Use

</label>

<br><br>

<br><br>

<button
id="addBtn">

Create Coupon

</button>

<hr>

<input
id="couponSearch"
placeholder="Search coupon">

<select
id="couponStatus">

<option value="all">
All
</option>

<option value="active">
Active
</option>

<option value="inactive">
Inactive
</option>

</select>

<button
onclick="exportCoupons()">

Export CSV

</button>

<hr>

<div
id="couponStats"
class="cards-grid">

Loading...

</div>

<br>

<div
id="couponList">

</div>

</div>

</div>

<div id="footer"></div>

<script src="/components/navbar-loader.js"></script>

<script src="/components/footer-loader.js"></script>

<script src="/components/sidebar-loader.js"></script>

<script
type="module"
src="/js/admin/coupons.js">
</script>

<script type="module">

import {
requireAdmin
}
from "/js/services/guard.js";

await requireAdmin();

</script>

</body>

</html>
