<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>

Support

</title>

<link rel="stylesheet"
href="/css/admin.css">

</head>

<body>

<div id="navbar"></div>

<div class="dashboard-layout">

<div id="sidebar"
class="sidebar"></div>

<div class="main-content">

<h1>

Support Tickets

</h1>

<br>

<input
id="ticketSearch"
placeholder="Search Ticket">

<br><br>

<button
id="exportSupportCsv">

Export CSV

</button>

<br><br>

<select
id="ticketFilter">

<option value="all">

All

</option>

<option value="open">

Open

</option>

<option value="closed">

Closed

</option>

</select>

<br><br>

<select
id="priorityFilter">

<option value="all">

All Priorities

</option>

<option value="Low">

Low

</option>

<option value="Medium">

Medium

</option>

<option value="High">

High

</option>

<option value="Urgent">

Urgent

</option>

</select>

<br><br>

<select
id="assignmentFilter">

<option value="all">

All Assignments

</option>

<option value="assigned">

Assigned

</option>

<option value="unassigned">

Unassigned

</option>

</select>

<br><br>

<select
id="replyFilter">

<option value="all">

All Tickets

</option>

<option value="replied">

Has Replies

</option>

<option value="unreplied">

No Replies

</option>

</select>

<br><br>

<div
id="supportStats"
class="cards-grid">

Loading...

</div>

<br>

<div id="supportContainer">

Loading...

</div>

</div>

</div>

<div id="footer"></div>

<script src="/components/navbar-loader.js"></script>
<script src="/components/footer-loader.js"></script>
<script src="/components/sidebar-loader.js"></script>

<script type="module"
src="/js/admin/support.js"></script>

<script type="module">

import{
requireAdmin
}
from "/js/services/guard.js";

await requireAdmin();

</script>

</body>

</html>
