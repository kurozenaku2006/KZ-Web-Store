<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Report Center

</title>

<link
rel="stylesheet"
href="/css/admin.css">

</head>

<body>

<div id="navbar"></div>

<div class="dashboard-layout">

<div
id="sidebar"
class="sidebar"></div>

<div class="main-content">

<h1>

Report Center

</h1>

<br>

<div class="cards-grid">

<div class="card">

<h3>

Export CSV

</h3>

<p>

Download complete analytics as CSV.

</p>

<button
id="exportCsvBtn">

Export CSV

</button>

</div>

<div class="card">

<h3>

Export PDF

</h3>

<p>

Generate printable business report.

</p>

<button
id="exportPdfBtn">

Export PDF

</button>

</div>

<div class="card">

<h3>

Scheduled Reports

</h3>

<p>

Automatic report generation.

</p>

<select
id="scheduleFrequency">

<option value="disabled">

Disabled

</option>

<option value="daily">

Daily

</option>

<option value="weekly">

Weekly

</option>

<option value="monthly">

Monthly

</option>

</select>

<br><br>

<button
id="saveScheduleBtn">

Save Schedule

</button>

</div>

</div>

<br>

<div
class="activity-box">

<h2>

Latest Report Summary

</h2>

<br>

<div
id="reportSummary">

Loading...

</div>

</div>

</div>

</div>

<div id="footer"></div>

<script src="/components/navbar-loader.js"></script>

<script src="/components/footer-loader.js"></script>

<script src="/components/sidebar-loader.js"></script>

<script
type="module"
src="/js/admin/reports.js">
</script>

<script type="module">

import{
requireAdmin
}
from "/js/services/guard.js";

await requireAdmin();

</script>

</body>

</html>
