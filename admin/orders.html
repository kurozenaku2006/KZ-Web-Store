<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Orders</title>

<link rel="stylesheet"
href="/css/admin.css">

</head>

<body>

<div style="padding:20px;">

    <h1>
        Order Management
    </h1>

    <br>

    <div class="card">

    <h3>
        Filter Orders
    </h3>

    <br>

    <button onclick="filterOrders('all')">
        All
    </button>

    <button onclick="filterOrders('pending')">
        Pending
    </button>

    <button onclick="filterOrders('approved')">
        Approved
    </button>

    <button onclick="filterOrders('rejected')">
        Rejected
    </button>

    <button onclick="filterOrders('shipped')">
        Shipped
    </button>

    <button onclick="filterOrders('delivered')">
        Delivered
    </button>

    <button onclick="filterOrders('cancelled')">
        Cancelled
    </button>

    <br><br>

<button onclick="exportOrders()">
    Export Orders CSV
</button>

</div>

<div class="card">

    <h3>
        Search Orders
    </h3>

    <br>

    <input
    type="text"
    id="orderSearch"
    placeholder="Search UID or Order ID"
    style="width:100%;padding:10px;">

</div>

<br>

<div
id="orderStats"
class="cards-grid">

Loading Statistics...

</div>

<br>

<select
id="paymentFilter">

<option value="all">
All Payments
</option>

<option value="paid">
Paid
</option>

<option value="pending">
Pending
</option>

<option value="failed">
Failed
</option>

</select>

<input
type="date"
id="orderDateFilter">

<br><br>

<br>

<br>

    <div id="ordersContainer">

        Loading Orders...

    </div>

</div>

<script
type="module"
src="/js/admin/orders.js">
</script>

<div
id="orderModal"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
overflow:auto;
padding:40px;
box-sizing:border-box;
z-index:9999;
">

<div
class="card"
style="
max-width:900px;
margin:auto;
">

<div
style="
display:flex;
justify-content:space-between;
align-items:center;
">

<h2>

Order Details

</h2>

<button
onclick="closeOrderModal()">

Close

</button>

</div>

<hr>

<div
id="orderModalContent">

Loading...

</div>

</div>

</div>

</body>

</html>
