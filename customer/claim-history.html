<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Claim History</title>

<link rel="stylesheet"
href="/css/customer.css">

</head>

<body>

<div id="navbar"></div>

<div style="display:flex;min-height:100vh;">

    <div
    id="sidebar"
    style="
    width:250px;
    padding:20px;
    border-right:1px solid #333;
    ">
    </div>

    <div
    style="
    flex:1;
    padding:20px;
    ">

        <h1>
            Claims
        </h1>

        <br>

        <div class="card">

            <h2>
                Submit Claim
            </h2>

            <br>

            <input
            id="orderId"
            placeholder="Order ID">

            <br><br>

            <input
            id="productId"
            placeholder="Product ID">

            <br><br>

            <input
            id="reason"
            placeholder="Reason">

            <br><br>

            <textarea
            id="description"
            placeholder="Description">
            </textarea>

            <br><br>

            <button
            id="submitClaimBtn">

                Submit Claim

            </button>

        </div>

        <br>

        <div
        id="claimsContainer">

            Loading...

        </div>

    </div>

</div>

<div id="footer"></div>

<script src="/components/navbar-loader.js"></script>
<script src="/components/footer-loader.js"></script>
<script src="/components/customer-sidebar-loader.js"></script>

<script
type="module"
src="/js/customer/claim-history.js">
</script>

</body>

</html>
