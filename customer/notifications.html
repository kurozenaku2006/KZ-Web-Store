<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

My Notifications

</title>

<link
rel="stylesheet"
href="/css/style.css">

</head>

<body>

<div id="navbar"></div>

<div class="container">

<h1>

Notifications

</h1>

<br>

<div class="card">

<h3>

Notification Preferences

</h3>

<br>

<label>

<input
type="checkbox"
id="prefInApp"
checked>

In-App Notifications

</label>

<br><br>

<label>

<input
type="checkbox"
id="prefEmail">

Email Notifications

</label>

<br><br>

<label>

<input
type="checkbox"
id="prefSMS">

SMS Notifications

</label>

<br><br>

<label>

<input
type="checkbox"
id="prefPush">

Push Notifications

</label>

<br><br>

<button
id="savePreferences">

Save Preferences

</button>

</div>

<br>

<br>

<input
id="notificationSearch"
placeholder="Search Notifications">

<br><br>

<select
id="channelFilter">

<option value="all">

All Channels

</option>

<option value="inapp">

In-App

</option>

<option value="email">

Email

</option>

<option value="sms">

SMS

</option>

<option value="push">

Push

</option>

</select>

<br><br>

<select
id="notificationFilter">

<option value="all">

All

</option>

<option value="unread">

Unread

</option>

<option value="read">

Read

</option>

<option value="archived">

Archived

</option>

</select>

<br><br>

<div
id="notificationList">

Loading...

</div>

</div>

<div id="footer"></div>

<script src="/components/navbar-loader.js"></script>

<script src="/components/footer-loader.js"></script>

<script
type="module"
src="/js/customer/notifications.js">
</script>

</body>

</html>
