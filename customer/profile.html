<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

My Profile

</title>

<link
rel="stylesheet"
href="/css/customer.css">

</head>

<body>

<div id="navbar"></div>

<div class="dashboard-layout">

<div
class="main-content">

<h1>

Customer Center

</h1>

<br>

<div class="cards-grid">

<div class="card">

<h3>

Profile

</h3>

<div
id="profileCard">

Loading...

</div>

<br>

<input
id="profileName"
placeholder="Full Name">

<br><br>

<button
id="saveProfileBtn">

Update Profile

</button>

</div>

<div class="card">

<h3>

Rewards

</h3>

<div
id="rewardCard">

Loading...

</div>

</div>

</div>

<br>

<div
class="activity-box">

<h2>

Addresses

</h2>

<br>

<div
id="addressList">

Loading...

</div>

<br>

<input
id="newAddress"
placeholder="New Address">

<button
id="addAddressBtn">

Add Address

</button>

</div>

<br>

<div
class="activity-box">

<h2>

Wishlist

</h2>

<br>

<div
id="wishlist">

Loading...

</div>

<br>

<button
id="clearWishlistBtn">

Clear Wishlist

</button>

<br>

<div
class="activity-box">

<h2>

Recent Orders

</h2>

<br>

<button
id="viewAllOrdersBtn">

View All Orders

</button>

<br>

<div
id="orders">

Loading...

</div>

</div>

<br>

<div
class="activity-box">

<h2>

Claims

</h2>

<br>

<button
id="viewAllClaimsBtn">

View All Claims

</button>

<br>

<div
id="claims">

Loading...

</div>

</div>

<br>

<div
class="activity-box">

<h2>

Settings

</h2>

<br>

<label>

Dark Mode

</label>

<input
type="checkbox"
id="darkMode">

<br><br>

<button
id="saveSettingsBtn">

Save Settings

</button>

</div>

</div>

</div>

<div id="footer"></div>

<script src="/components/navbar-loader.js"></script>

<script src="/components/footer-loader.js"></script>

<script
type="module"
src="/js/customer/profile.js">
</script>

</body>

</html>
