<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Support

</title>

<link
rel="stylesheet"
href="/css/style.css">

</head>

<body>

<div id="navbar"></div>

<div class="container">

<h1>

Support Center

</h1>

<br>

<input
id="subject"
placeholder="Subject">

<br><br>

<textarea
id="message"
placeholder="Describe your issue">
</textarea>

<br><br>

<select
id="priority">

<option value="Low">

Low

</option>

<option value="Medium"
selected>

Medium

</option>

<option value="High">

High

</option>

<option value="Urgent">

Urgent

</option>

</select>

<br><br>

<button
id="createTicket">

Create Ticket

</button>

<br><br>

<textarea
id="replyMessage"
placeholder="Reply to selected ticket">
</textarea>

<br><br>

<button
id="sendReply">

Send Reply

</button>

<hr>

<input
id="ticketSearch"
placeholder="Search Tickets">

<br><br>

<div
id="ticketList">

Loading...

</div>

</div>

<div id="footer"></div>

<script src="/components/navbar-loader.js"></script>

<script src="/components/footer-loader.js"></script>

<script
type="module"
src="/js/customer/support.js">
</script>

</body>

</html>
