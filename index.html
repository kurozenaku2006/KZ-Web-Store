<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

KZ HOBBIES

</title>

<link
rel="stylesheet"
href="/css/customer.css">

</head>

<body>

<div id="navbar"></div>

<div style="padding:20px;">

<h1>

Shop

</h1>

<br>

<div
id="productCount">

</div>

<br>

<input
id="searchInput"
placeholder="Search Products">

<div
id="searchSuggestions"
style="
background:#1e2230;
border-radius:8px;
margin-top:5px;
display:none;
max-width:400px;
">
</div>

<br>

<div
id="recentSearches">

</div>

<br>

<div
id="trendingSearches">

</div>

<br><br>

<select
id="stockFilter">

<option value="all">

All Products

</option>

<option value="in">

In Stock

</option>

<option value="out">

Out Of Stock

</option>

</select>

<br><br>

<select
id="categoryFilter">

<option value="all">

All Categories

</option>

</select>

<br><br>

<select
id="brandFilter">

<option value="all">

All Brands

</option>

</select>

<br><br>

<select
id="sortProducts">

<option value="latest">

Latest

</option>

<option value="priceLow">

Price : Low → High

</option>

<option value="priceHigh">

Price : High → Low

</option>

<option value="stock">

Stock

</option>

</select>

<br><br>

<div
id="productGrid">

Loading Products...

</div>

<br>

<button
id="loadMore">

Load More

</button>

<br><br>

<h2>

Featured Products

</h2>

<div
id="featuredProducts">

Loading...

</div>

<br><br>

<h2>

Recently Added

</h2>

<div
id="recentProducts">

Loading...

</div>

<br><br>

<h2>

Popular Products

</h2>

<br>

<input

id="maxPrice"

type="number"

placeholder="Maximum Price">

<button
id="applyPrice">

Apply

</button>

<br><br>

<div
id="popularProducts">

Loading...

</div>

</div>

<div id="footer"></div>

<script src="/components/navbar-loader.js"></script>
<script src="/components/footer-loader.js"></script>

<script
type="module"
src="/js/customer/home.js">
</script>

</body>

</html>
